<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MacMitchell NZ RAV4</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 2rem;
    }
    #car-viewer {
      width: 800px;
      max-width: 100%;
      margin: 0 auto;
    }
  </style>

  <!-- Load jQuery and SpriteSpin -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/spritespin@4.0.11/release/spritespin.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/spritespin@4.0.11/release/spritespin.min.css" rel="stylesheet" />
</head>
<body>

  <h1>MacMitchell NZ RAV4</h1>
  <div id="car-viewer"></div>

  <script>
    // Generate array of image paths
    const frames = [];
    for (let i = 1; i <= 30; i++) {
      const num = String(i).padStart(3, '0'); // car001.jpg to car030.jpg
      frames.push(`images/car${num}.jpg`);
    }

    $("#car-viewer").spritespin({
      source: frames,
      width: 800,
      height: 450,
      sense: -1,
      animate: false,
      loop: false,
      frameTime: 60,
      responsive: true
    });
  </script>

</body>
</html>
