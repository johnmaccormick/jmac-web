<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MacMitchell NZ RAV4</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 2rem;
    }
    #car-viewer {
      width: 800px;
      max-width: 100%;
      margin: 0 auto;
    }
  </style>

  <!-- jQuery and SpriteSpin -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/spritespin@4.0.11/release/spritespin.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/spritespin@4.0.11/release/spritespin.min.css" rel="stylesheet" />
</head>
<body>

  <h1>MacMitchell NZ RAV4</h1>
  <div id="car-viewer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      console.log("DOM loaded");

      // Create the image list
      const frames = [];
      for (let i = 1; i <= 30; i++) {
        const num = String(i).padStart(3, '0'); // car001.jpg to car030.jpg
        frames.push(`images/car${num}.jpg`);
      }

      // Initialize SpriteSpin
      $("#car-viewer").spritespin({
        source: frames,
        width: 800,
        height: 450,
        sense: -1,
        animate: false,
        loop: false,
        frameTime: 60,
        responsive: true,

        onLoad: function (e, data) {
          console.log("SpriteSpin loaded");

          const api = $("#car-viewer").spritespin("api");
          // const api = data.api;

          if (!api) {
            console.error("SpriteSpin API is not available.");
            return;
          }

          // Log current frame for further debugging
          console.log("Initial frame:", api.frame);

          // Add keyboard arrow support
          document.addEventListener("keydown", function (event) {
            console.log("Key pressed:", event.key);

            if (event.key === "ArrowRight") {
              console.log("Moving to next frame");
              api.nextFrame();
            } else if (event.key === "ArrowLeft") {
              console.log("Moving to previous frame");
              api.prevFrame();
            }
          });
        }
      });
    });
  </script>

</body>
</html>
